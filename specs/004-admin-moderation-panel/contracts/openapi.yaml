openapi: 3.1.0
info:
  title: DáPraIr? Admin & Moderation API
  description: Endpoints restritos para administradores e moderadores (RBAC) para gestão de denúncias, moderação de conteúdos unificados, controle de usuários e trilha de auditoria.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Base URL v1

security:
  - BearerAuth: []

paths:
  /admin/dashboard/stats:
    get:
      summary: Métricas e estatísticas gerais do painel
      operationId: getDashboardStats
      tags:
        - Admin Dashboard
      responses:
        '200':
          description: Estatísticas consolidadas de moderação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/reports:
    get:
      summary: Fila de denúncias com filtros
      operationId: listReports
      tags:
        - Admin Reports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, IN_REVIEW, RESOLVED_SANCTIONED, DISMISSED]
          description: Filtrar por status da denúncia
        - name: targetType
          in: query
          schema:
            type: string
            enum: [FORUM_TOPIC, FORUM_COMMENT, PLACE_REVIEW, PLACE_MEDIA, USER]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista paginada de denúncias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/reports/{id}:
    get:
      summary: Detalhes contextuais de uma denúncia
      operationId: getReportDetails
      tags:
        - Admin Reports
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da denúncia e do item alvo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Resolver ou descartar denúncia
      operationId: resolveReport
      tags:
        - Admin Reports
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '200':
          description: Denúncia resolvida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailResponse'

  /admin/content:
    get:
      summary: Busca unificada de conteúdos postados
      operationId: listUnifiedContent
      tags:
        - Admin Content
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [ALL, FORUM_TOPIC, FORUM_COMMENT, PLACE_REVIEW, PLACE_MEDIA]
            default: ALL
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, HIDDEN, REMOVED]
        - name: query
          in: query
          schema:
            type: string
          description: Termo de busca textual no conteúdo ou título
        - name: authorId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista paginada de conteúdos postados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedContentListResponse'

  /admin/content/{type}/{id}/hide:
    patch:
      summary: Ocultar conteúdo preventivamente (reversível)
      operationId: hideContent
      tags:
        - Admin Content
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [FORUM_TOPIC, FORUM_COMMENT, PLACE_REVIEW, PLACE_MEDIA]
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
      responses:
        '200':
          description: Conteúdo ocultado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResultResponse'

  /admin/content/{type}/{id}/restore:
    patch:
      summary: Restaurar conteúdo previamente ocultado
      operationId: restoreContent
      tags:
        - Admin Content
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [FORUM_TOPIC, FORUM_COMMENT, PLACE_REVIEW, PLACE_MEDIA]
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
      responses:
        '200':
          description: Conteúdo restaurado para visibilidade normal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResultResponse'

  /admin/content/{type}/{id}:
    delete:
      summary: Excluir conteúdo em definitivo (com cascata em tópicos)
      operationId: deleteContent
      tags:
        - Admin Content
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [FORUM_TOPIC, FORUM_COMMENT, PLACE_REVIEW, PLACE_MEDIA]
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteContentRequest'
      responses:
        '200':
          description: Conteúdo excluído com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResultResponse'

  /admin/users:
    get:
      summary: Listagem e busca de usuários
      operationId: listUsers
      tags:
        - Admin Users
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, WARNED, SUSPENDED, BANNED]
        - name: query
          in: query
          schema:
            type: string
            description: Busca por nome, email ou handle
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'

  /admin/users/{id}:
    get:
      summary: Ficha detalhada do usuário com histórico de penalidades
      operationId: getUserDetails
      tags:
        - Admin Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ficha cadastral e histórico de infrações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'

  /admin/users/{id}/penalties:
    post:
      summary: Aplicar sanção/penalidade (advertência, suspensão ou banimento)
      operationId: applyUserPenalty
      tags:
        - Admin Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPenaltyRequest'
      responses:
        '201':
          description: Penalidade aplicada e sessões invalidadas se aplicável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPenaltyResponse'

  /admin/users/{id}/penalties/{penaltyId}:
    delete:
      summary: Revogar penalidade / Reativar conta de usuário
      operationId: revokePenalty
      tags:
        - Admin Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: penaltyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokePenaltyRequest'
      responses:
        '200':
          description: Penalidade revogada e conta reativada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'

  /admin/audit-logs:
    get:
      summary: Trilha imutável de auditoria de moderação
      operationId: listAuditLogs
      tags:
        - Admin Audit
      parameters:
        - name: moderatorId
          in: query
          schema:
            type: string
            format: uuid
        - name: actionType
          in: query
          schema:
            type: string
        - name: targetType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista paginada de registros de auditoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Token ausente, inválido ou revogado por banimento
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Acesso restrito a administradores e moderadores (RBAC)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string

    DashboardStatsResponse:
      type: object
      required:
        - pendingReportsCount
        - actionsTodayCount
        - activePenaltiesCount
        - totalUsersCount
      properties:
        pendingReportsCount:
          type: integer
        actionsTodayCount:
          type: integer
        activePenaltiesCount:
          type: integer
        totalUsersCount:
          type: integer

    ReportsListResponse:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportSummary'

    ReportSummary:
      type: object
      required:
        - id
        - targetType
        - targetId
        - reason
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
        targetId:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
        details:
          type: string
        reporterMaskedName:
          type: string
        createdAt:
          type: string
          format: date-time

    ReportDetailResponse:
      type: object
      required:
        - id
        - targetType
        - targetId
        - reason
        - status
        - createdAt
        - targetContent
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
        targetId:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
        details:
          type: string
        reporterMaskedName:
          type: string
        createdAt:
          type: string
          format: date-time
        targetContent:
          type: object
          description: Snapshot e dados do conteúdo alvo denunciado
        priorReportsCount:
          type: integer

    ResolveReportRequest:
      type: object
      required:
        - action
        - resolutionNotes
      properties:
        action:
          type: string
          enum: [ACCEPT_ACTION_APPLIED, DISMISS_UNFOUNDED]
        resolutionNotes:
          type: string
          minLength: 10

    UnifiedContentListResponse:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedContentItem'

    UnifiedContentItem:
      type: object
      required:
        - id
        - type
        - titleOrSnippet
        - author
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [FORUM_TOPIC, FORUM_COMMENT, PLACE_REVIEW, PLACE_MEDIA]
        titleOrSnippet:
          type: string
        author:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            handle:
              type: string
        status:
          type: string
        reportsCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ModerationActionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 10
          description: Justificativa obrigatória da ação

    DeleteContentRequest:
      type: object
      required:
        - reason
        - confirm
      properties:
        reason:
          type: string
          minLength: 10
        confirm:
          type: boolean
          description: Confirmação dupla mandatória

    ModerationResultResponse:
      type: object
      required:
        - targetId
        - newStatus
        - actionLogged
      properties:
        targetId:
          type: string
          format: uuid
        newStatus:
          type: string
        cascadeCount:
          type: integer
          description: Quantidade de itens filhos moderados em cascata
        actionLogged:
          type: boolean

    UsersListResponse:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      required:
        - id
        - name
        - handle
        - email
        - role
        - status
        - penaltiesCount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handle:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        penaltiesCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    UserDetailResponse:
      type: object
      required:
        - id
        - name
        - handle
        - email
        - role
        - status
        - penalties
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handle:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        penalties:
          type: array
          items:
            $ref: '#/components/schemas/UserPenaltyResponse'
        createdAt:
          type: string
          format: date-time

    ApplyPenaltyRequest:
      type: object
      required:
        - penaltyType
        - reason
      properties:
        penaltyType:
          type: string
          enum: [WARNING, SUSPENSION_7_DAYS, PERMANENT_BAN]
        reason:
          type: string
          minLength: 10

    RevokePenaltyRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 10

    UserPenaltyResponse:
      type: object
      required:
        - id
        - userId
        - penaltyType
        - reason
        - startsAt
        - status
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        penaltyType:
          type: string
        reason:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string

    AuditLogsResponse:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogItem'

    AuditLogItem:
      type: object
      required:
        - id
        - moderatorId
        - actionType
        - targetType
        - targetId
        - reason
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        moderatorId:
          type: string
          format: uuid
        moderatorName:
          type: string
        actionType:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          format: uuid
        reason:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
